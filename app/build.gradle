plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clipkey.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clipkey.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
